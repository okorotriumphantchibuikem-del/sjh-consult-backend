<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SJH Consult</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../shared.css">
    <link rel="stylesheet" href="../redesign.css">
    <script src="auth-config.js"></script>
</head>
<body>
<header class="sjh-shared-header">
    <div class="sjh-header-container">
        <a href="../index.html" class="sjh-brand">
            <span class="sjh-brand-mark">SJH</span>
            <span class="sjh-brand-text"><strong>SJH Consult</strong><small>PROFESSIONAL SERVICES</small></span>
        </a>
    </div>
</header>
<main class="login-page" style="min-height:70vh;align-items:center;justify-content:center;padding:60px 20px;">
    <section class="login-card" style="max-width:560px;">
        <div class="card-top">
            <div class="card-icon">SJH</div>
            <span>PASSWORD RESET</span>
            <h2>Choose a new password</h2>
            <p>Enter a new password for your SJH Consult account.</p>
        </div>
        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="password">New password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" minlength="8" autocomplete="new-password" required>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" minlength="8" autocomplete="new-password" required>
                </div>
            </div>
            <div id="resetMessage" class="login-message" role="alert"></div>
            <button type="submit" class="login-button" id="resetButton">Reset Password <span>→</span></button>
        </form>
        <p style="text-align:center;margin-top:20px;"><a href="login.html">Back to Login</a></p>
    </section>
</main>
<script src="reset-password.js"></script>
</body>
</html>
